name: proberaum/backstage-plugins main

# Sets permissions of the GITHUB_TOKEN to allow pushing a conatainer image to ghcr.io
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace folder under workspaces/
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workspace input
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [[ ! "$WORKSPACE" =~ ^[a-zA-Z-]+$ ]]; then
            echo "Invalid workspace: $WORKSPACE"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml
    with:
      repo: https://github.com/proberaum/backstage-plugins
      branch: main
      workspace: ${{ inputs.workspace }}
      imageName: proberaum-${{ inputs.workspace }}
