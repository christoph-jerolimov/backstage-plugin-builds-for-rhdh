name: proberaum/backstage-plugins main

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace folder under workspaces/
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workspace input
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [[ ! "$WORKSPACE" =~ ^[a-zA-Z-]+$ ]]; then
            echo "Invalid workspace: $WORKSPACE"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      repo: https://github.com/proberaum/backstage-plugins
      branch: main
      workspace: ${{ inputs.workspace }}
      imageName: proberaum-${{ inputs.workspace }}
