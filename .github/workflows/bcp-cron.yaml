name: backstage/community-plugins cron

# Sets permissions of the GITHUB_TOKEN to allow pushing a container image to ghcr.io
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  # schedule:
  #   - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - acr
          - argocd
          - bookmarks
          - jfrog-artifactory
          - multi-source-security-viewer
          - nexus-repository-manager
          - npm
          - ocm
          - quay
          - rbac
          - servicenow
          - tekton
          - topology
    uses: ./.github/workflows/build.yaml
    with:
      repo: https://github.com/backstage/community-plugins
      branch: main
      workdir: workspaces/${{ matrix.workspace }}
      imageName: bcp-${{ matrix.workspace }}
