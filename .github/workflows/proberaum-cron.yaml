name: proberaum/backstage-plugins cron

# Sets permissions of the GITHUB_TOKEN to allow pushing a container image to ghcr.io
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  # schedule:
  #   - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - analytics-viewer
          - config-viewer
          - devtools
          - env-viewer
          - github-notifications
          - hcloud
          - icon-viewer
          - permissions-viewer
          - scheduler-notifications
          - whats-new
    uses: ./.github/workflows/build.yaml
    with:
      repo: https://github.com/proberaum/backstage-plugins
      branch: main
      workdir: workspaces/${{ matrix.workspace }}
      imageName: proberaum-${{ matrix.workspace }}
