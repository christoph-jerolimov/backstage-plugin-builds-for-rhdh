name: backstage/community-plugins main

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace folder under workspaces/
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workspace input
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [[ ! "$WORKSPACE" =~ ^[a-zA-Z-]+$ ]]; then
            echo "Invalid workspace: $WORKSPACE"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml
    with:
      repo: https://github.com/backstage/community-plugins
      branch: main
      workspace: ${{ inputs.workspace }}
      imageName: ${{ inputs.workspace }}
