name: backstage/backstage main

# Sets permissions of the GITHUB_TOKEN to allow pushing a container image to ghcr.io
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Plugin folder under plugins/
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workspace input
        env:
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [[ ! "$WORKSPACE" =~ ^[a-zA-Z-]+$ ]]; then
            echo "Invalid workspace: $WORKSPACE"
            exit 1
          fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml
    with:
      repo: https://github.com/backstage/backstage
      branch: master
      workdir: plugins/${{ inputs.workspace }}
      imageName: backstage-${{ inputs.workspace }}
